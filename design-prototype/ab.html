<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Health++ · A/B two builds</title>
<style>body{margin:16px;font:13px/1.4 system-ui,sans-serif} .row{display:flex;gap:12px} canvas{width:412px;height:915px;display:block} .wrap{width:206px;height:458px;overflow:hidden} .wrap canvas{transform:scale(.5);transform-origin:0 0} pre{font:12px ui-monospace,monospace}</style></head>
<body>
<!-- Review tool: renders the same frozen state with two builds of scene-gl.js (each in its own iframe-free load, one after the other) and reports PSNR.
     ?a=<file>&b=<file>&h=13,23&seed=20774  (b may be "baked:<set>[@build]", or "baked:sky-cache/<seed>-<regime>/" for layers baked on this device) -->
<div class="row"><div class="wrap"><canvas id="c"></canvas></div></div>
<pre id="out">running…</pre>
<script>
const q = new URLSearchParams(location.search), hours = (q.get('h') || '13').split(',').map(Number), seed = +(q.get('seed') || 20774), r = q.has('r') ? +q.get('r') : 86;
const load = src => new Promise((ok, no) => { delete window.SceneGL; const s = document.createElement('script'); s.src = src + '?' + Date.now(); s.onload = () => ok(window.SceneGL); s.onerror = no; document.head.appendChild(s); });
const wait = ms => new Promise(res => setTimeout(res, ms));
async function frame(src, hour) {                                       // one fresh canvas per render
  const [file, bakedSet] = src.startsWith('baked:') ? [src.split('@')[1] || 'scene-gl.js', src.slice(6).split('@')[0]] : [src, null];   // baked:<set>[@<build>]
  const G = await load(file), old = document.getElementById('c'), c = document.createElement('canvas'); c.id = 'c'; old.replaceWith(c);
  const S = G.mount(c, { dpr: 2, seed, hour, readiness: r, animate: false, baked: bakedSet ? (bakedSet.includes('/') ? bakedSet : `baked/${bakedSet}/`) : undefined });
  while (!(S.ready ?? S.frames >= 24)) await wait(100); await wait(300);   // older builds have no ready flag
  const gl = c.__gl, p = new Uint8Array(c.width * c.height * 4); gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.readPixels(0, 0, c.width, c.height, gl.RGBA, gl.UNSIGNED_BYTE, p);
  gl.getExtension('WEBGL_lose_context')?.loseContext(); return { p, W: c.width, H: c.height };
}
(async () => {
  const res = {};
  for (const h of hours) {
    const A = await frame(q.get('a'), h), B = await frame(q.get('b'), h);
    let se = 0; const band = new Float64Array(10), n = new Float64Array(10);
    for (let i = 0; i < A.p.length; i += 4) { let e = 0; for (let k = 0; k < 3; k++) e += (A.p[i + k] - B.p[i + k]) ** 2; se += e; const j = Math.min(9, Math.floor((1 - Math.floor(i / 4 / A.W) / A.H) * 10)); band[j] += e; n[j]++; }
    const db = (e, c) => +(10 * Math.log10(255 * 255 / Math.max(1e-9, e / (3 * c)))).toFixed(1);
    res[h] = { psnr: db(se, A.p.length / 4), worstBand: Math.min(...[...band].map((e, j) => db(e, n[j]))) };
  }
  document.getElementById('out').textContent = JSON.stringify(res, null, 1); window.AB = res;
})().catch(e => { document.getElementById('out').textContent = 'FAILED ' + e.message; window.AB = { error: e.message }; });
</script>
</body>
</html>
