# JCWear Coach API on sterver.
# - Own SQLite DB on the SSD (never shares Immich's Postgres).
# - Bound to loopback only; reached via Tailscale Serve (https://sterver.tail24d7a.ts.net:8443).
# - Port 8421 because 8420 is taken by stavsboard.
services:
  jcwear-coach-api:
    build: .
    image: jcwear-coach-api:1.0.0
    container_name: jcwear-coach-api
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8421:8420"
    environment:
      - DATABASE_URL=sqlite
      - SQLITE_FALLBACK_PATH=/data/jcwear_homelab.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-5-5}
      - SYNC_API_TOKEN=${SYNC_API_TOKEN:?set SYNC_API_TOKEN in .env}
    volumes:
      - ./data:/data
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
